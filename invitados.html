<style>
/* Layout: one-column console for a phone at the door; big input, full-color verdict, counters and guest list below. */
/* Brand (from the KALOP logo): orange #FD6B00, blue #009EE2, graphite #54585B. Semantic green/red/amber stay separate from the brand orange. */
:root {
  --brand-orange: #fd6b00;
  --brand-blue: #009ee2;
  --brand-grey: #54585b;
  --bg: #f1f3f4;
  --surface: #ffffff;
  --fg: #2a2e31;
  --muted: #54585b;
  --line: #d9dddf;
  --primary: #009ee2;
  --primary-fg: #ffffff;
  --header: #ffffff;
  --header-fg: #54585b;
  --tab-bg: #eceef0;
  --tab-on: #54585b;
  --tab-on-fg: #ffffff;
  --ok: #137a3a;
  --bad: #c0262d;
  --warn: #b07a00;
  --ok-soft: #e3f3e8;
  --bad-soft: #fbe6e7;
  --warn-soft: #fbf1d6;
  --ok-text: #137a3a;
  --bad-text: #b0222a;
  --warn-text: #8a5f00;
  --focus: #009ee2;
  --logo-light: block;
  --logo-dark: none;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1c1e; --surface: #24272a; --fg: #eceeef; --muted: #a6abaf; --line: #363a3e;
    --primary: #009ee2; --primary-fg: #ffffff; --header: #24272a; --header-fg: #eceeef;
    --tab-bg: #1a1c1e; --tab-on: #eceeef; --tab-on-fg: #24272a;
    --ok: #1f8a48; --bad: #c4343b; --warn: #a87400;
    --ok-soft: #15301f; --bad-soft: #3a1a1c; --warn-soft: #362a0e; --focus: #33b4ec;
    --ok-text: #6fd897; --bad-text: #ff9599; --warn-text: #f2bd4a;
    --logo-light: none; --logo-dark: block;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1c1e; --surface: #24272a; --fg: #eceeef; --muted: #a6abaf; --line: #363a3e;
  --primary: #009ee2; --primary-fg: #ffffff; --header: #24272a; --header-fg: #eceeef;
  --tab-bg: #1a1c1e; --tab-on: #eceeef; --tab-on-fg: #24272a;
  --ok: #1f8a48; --bad: #c4343b; --warn: #a87400;
  --ok-soft: #15301f; --bad-soft: #3a1a1c; --warn-soft: #362a0e; --focus: #33b4ec;
    --ok-text: #6fd897; --bad-text: #ff9599; --warn-text: #f2bd4a;
  --logo-light: none; --logo-dark: block;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { background: var(--header); color: var(--header-fg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 1px 0 var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; padding-block: 12px; }
/* Stripe echoing the K mark: orange block, then blue. */
header.top::after { content: ""; display: block; height: 5px; background: linear-gradient(90deg, var(--brand-orange) 0 34%, var(--brand-blue) 34% 100%); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 28px; width: auto; max-width: 100%; }
.brand .logo-light { display: var(--logo-light); }
.brand .logo-dark { display: var(--logo-dark); }
.app-band { color: #fff; font-family: var(--display); font-weight: 900; font-stretch: 115%; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; }
.app-band .wrap { padding-block: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.app-band small { font-family: var(--body); font-size: 12px; font-weight: 700; font-stretch: 100%; letter-spacing: 0.1em; opacity: 0.9; }
.band-inv { background: var(--brand-blue); }
.brand-sub { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; line-height: 1.2; }
.tabs { display: flex; gap: 4px; background: var(--tab-bg); padding: 4px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; color: var(--header-fg); padding: 8px 12px; border-radius: 7px; font-weight: 700; font-size: 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--tab-on); color: var(--tab-on-fg); }

main { padding-block: 20px 48px; display: grid; gap: 20px; }

.notice { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; font-size: 14px; color: var(--muted); display: grid; gap: 10px; }
.notice strong { color: var(--fg); }
.notice.alert { border-color: var(--warn); background: var(--warn-soft); color: var(--fg); }

/* Check form */
.check { display: grid; gap: 12px; }
.check label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.check-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
#dni { width: 100%; min-width: 0; font-family: var(--mono); font-weight: 600; font-size: clamp(24px, 6.6vw, 40px); letter-spacing: 0.02em; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); font-variant-numeric: tabular-nums; }
#dni:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
.btn { border: 0; border-radius: 12px; padding: 0 22px; min-height: 48px; font-weight: 800; font-size: 18px; padding-inline: 18px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; background: var(--primary); color: var(--primary-fg); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); text-transform: none; font-weight: 600; letter-spacing: 0; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 9px; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 8px; }

/* Verdict */
.verdict { border-radius: 16px; padding: 24px 20px; min-height: 168px; display: grid; align-content: center; gap: 8px; text-align: center; background: var(--surface); border: 2px dashed var(--line); color: var(--muted); transition: opacity .2s; }
.verdict .big { font-family: var(--display); font-weight: 900; font-stretch: 110%; line-height: 1.05; text-wrap: balance; }
.verdict .who { font-size: 20px; font-weight: 700; }
.verdict .meta { font-family: var(--mono); font-size: 15px; opacity: 0.9; }
.verdict.idle .big { font-size: 20px; font-weight: 600; font-stretch: 100%; }
.verdict .mark { width: 46px; height: auto; margin: 0 auto 4px; opacity: 0.9; }
.verdict.ok, .verdict.bad, .verdict.warn { border: 0; color: #fff; }
.verdict.ok { background: var(--ok); }
.verdict.ok .big { font-size: clamp(56px, 18vw, 96px); letter-spacing: 0.04em; }
.verdict.bad { background: var(--bad); }
.verdict.warn { background: var(--warn); }
.verdict.bad .big, .verdict.warn .big { font-size: clamp(26px, 7vw, 36px); }
.verdict.stale { opacity: 0.35; }
.verdict.busy .big { font-size: 20px; }
@keyframes pop { from { transform: scale(0.97); } to { transform: scale(1); } }
.verdict.ok, .verdict.bad, .verdict.warn { animation: pop .18s ease-out; }
@media (prefers-reduced-motion: reduce) { .verdict { animation: none !important; transition: none; } }

/* Counters */
.stats { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat .n { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--brand-blue); width: 0; transition: width .3s; }

h2 { font-family: var(--display); font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; margin: 0; color: var(--muted); }
.section { display: grid; gap: 10px; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .d { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.list .nm { min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.list .t { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.list .empty { display: block; color: var(--muted); font-size: 14px; padding: 16px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok-text); }
.pill.bad { background: var(--bad-soft); color: var(--bad-text); }
.pill.warn { background: var(--warn-soft); color: var(--warn-text); }
.pill.idle { background: var(--bg); color: var(--muted); }

/* Guests tab */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#buscar { flex: 1 1 220px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card code { font-family: var(--mono); font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; color: var(--fg); }
#pegar { width: 100%; min-height: 140px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); font-family: var(--mono); font-size: 14px; resize: vertical; }
.file-label { display: inline-flex; align-items: center; }
.file-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file-label:focus-within .btn { outline: 3px solid var(--focus); outline-offset: 2px; }
.progress { font-size: 14px; color: var(--muted); font-family: var(--mono); }
.confirm { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 12px; display: grid; gap: 10px; font-size: 14px; }
.more { color: var(--muted); font-size: 13px; text-align: center; }

.big-input { width: 100%; min-width: 0; font-family: var(--mono); font-weight: 600; font-size: clamp(24px, 6.6vw, 40px); letter-spacing: 0.02em; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); font-variant-numeric: tabular-nums; }
.big-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent); }
</style>

<style>
/* v3: shared by Invitados (light, blue band) and Personal (dark, orange band). */
body { --band: var(--brand-blue); --out: #0b78b3; --out-soft: #e2f1fa; --out-text: #0a6a9e; }
body[data-app="personal"] {
  --bg: #1d2023; --surface: #2a2e32; --fg: #eef0f1; --muted: #a9aeb2; --line: #3b4045;
  --primary: #fd6b00; --primary-fg: #ffffff; --header: #141618; --header-fg: #eef0f1;
  --tab-bg: #1d2023; --tab-on: #eef0f1; --tab-on-fg: #1d2023;
  --ok: #1f8a48; --bad: #c4343b; --warn: #a87400; --out: #0b78b3;
  --ok-soft: #15301f; --bad-soft: #3a1a1c; --warn-soft: #362a0e; --out-soft: #0f2c3d; --focus: #ff9a4d;
  --ok-text: #6fd897; --bad-text: #ff9599; --warn-text: #f2bd4a; --out-text: #6cc7f2;
  --logo-light: none; --logo-dark: block; --band: var(--brand-orange);
  color-scheme: dark;
}
.app-band { background: var(--band); }
header.top .wrap { flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 700 12px/1 var(--body); padding: 7px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); white-space: nowrap; }
button.chip { cursor: pointer; }
.chip.red::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 0; }
.chip.red.off { border-color: var(--warn); color: var(--warn-text); }
.chip.red.off::before { background: var(--warn); }
.chip.red.sending::before { background: var(--brand-blue); }
.mid-input { width: 100%; min-width: 0; padding: 12px 14px; font-size: 18px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.mid-input:focus, .big-input:focus { border-color: var(--primary); outline: none; }
.err { color: var(--bad-text); font-size: 14px; font-weight: 700; }
#control { gap: 18px; }
main, .section, .alertas { grid-template-columns: minmax(0, 1fr); }
.alerta span, .verdict .meta, .list .nm { overflow-wrap: anywhere; }
.alertas { display: grid; gap: 10px; }
.alerta { background: var(--bad); color: #fff; border-radius: 12px; padding: 14px; display: grid; gap: 10px; font-weight: 600; font-size: 16px; animation: pop .18s ease-out; }
.alerta strong { font-family: var(--display); font-weight: 900; font-size: 18px; letter-spacing: 0.04em; }
.alerta button { justify-self: start; background: #fff; color: #8f1b21; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 800; font-size: 15px; cursor: pointer; }
.verdict .extra { font-size: 20px; font-weight: 900; }
.verdict .nota { justify-self: center; max-width: 100%; background: rgba(0,0,0,0.25); border-radius: 8px; padding: 6px 12px; font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
.verdict .sync { font-size: 13px; font-weight: 600; opacity: 0.85; }
.verdict.out { background: var(--out); border: 0; color: #fff; animation: pop .18s ease-out; }
.verdict.out .big { font-size: clamp(52px, 16vw, 88px); letter-spacing: 0.04em; }
.pill.out { background: var(--out-soft); color: var(--out-text); }
.undo { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--muted); margin-top: -6px; }
.buscar { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.buscar summary { cursor: pointer; font-weight: 700; color: var(--fg); }
.buscar > * + * { margin-top: 12px; }
.buscar .list li { grid-template-columns: 1fr auto; }
.list .acc { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.list .st { font-size: 12px; color: var(--muted); white-space: nowrap; }
.list .st.conf { color: var(--bad-text); font-weight: 800; }
.stats .extra-line { font-size: 13px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
.tools .more { flex: 1 1 100%; text-align: left; }
.setup { display: grid; gap: 10px; }
.setup .btn { margin-top: 6px; }
.confirmar { display: grid; gap: 10px; background: var(--warn-soft); border: 2px solid var(--warn); border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; color: var(--fg); margin-top: -6px; }
.confirmar-btns { display: flex; flex-wrap: wrap; gap: 8px; }
body[data-app="personal"] .big-input { font-size: clamp(22px, 6vw, 40px); }
body[data-app="personal"] #btn-check { padding-inline: 14px; }
</style>

<script>
(() => {
  const MODO = document.body.dataset.app === "personal" ? "personal" : "invitados";
  const P = MODO === "personal";
  const T = P ? {
    banda: "Personal contratado", sub: "Entrada / salida", dni: "DNI de la persona contratada", boton: "Registrar",
    otro: "Este DNI es de un INVITADO", otroMeta: "Usá el sistema de Invitados (franja celeste)",
    no: "Este DNI no se encuentra en la lista de personal",
    s: ["Adentro ahora", "Afuera", "Personal"], vacia: "La lista de personal está vacía. El organizador todavía no la cargó (hoja Personal).",
  } : {
    banda: "Invitados", sub: "Clientes", dni: "DNI del invitado", boton: "Verificar",
    otro: "Este DNI es de PERSONAL CONTRATADO", otroMeta: "Usá el sistema de Personal (franja naranja)",
    no: "Este DNI no se encuentra en la base de datos",
    s: ["Ingresaron", "Faltan", "Invitados"], vacia: "La lista de invitados está vacía. El organizador todavía no la cargó.",
  };
  const MSG_YA = "Este número de DNI ya ingresó";

  const $ = (id) => document.getElementById(id);
  const onlyDigits = (s) => String(s == null ? "" : s).replace(/\D/g, "");
  const fmtDni = (d) => onlyDigits(d).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const nowHora = () => new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const K = (k) => `kalop-${MODO}-${k}`;
  const store = {
    get(k, def) { try { const v = localStorage.getItem(K(k)); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem(K(k), JSON.stringify(v)); } catch (e) {} },
  };

  const S = {
    pin: store.get("pin", ""), guardia: store.get("guardia", ""),
    lista: new Map(), otros: new Set(), version: "", listaHora: "", cargada: false,
    pend: store.get("pend", []), hist: store.get("hist", []),
    inflight: false, enviando: new Set(), online: true, retry: 0, retryTimer: null, polls: 0, syncSeq: 0,
    sonido: store.get("sonido", true), undo: null, verdictId: null,
  };

  /* ---------- Backend: Google Apps Script (or an in-memory demo outside Google) ---------- */
  const API = "https://script.google.com/macros/s/AKfycbzxDjc5Lq-XU4Vy7ULqkIKHLxBxcrV0fuSFmr6DjbufEn-oaQmiQ6HP0EU6za_E9E8Psw/exec";
  const demo = !API && (typeof google === "undefined" || !google.script);
  async function callApi(fn, args) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }), signal: ctrl.signal });
      if (!r.ok) throw new Error("http " + r.status);
      const d = await r.json();
      if (d && d.error && d.error !== "pin") throw new Error(d.error);
      return d;
    } finally { clearTimeout(timer); }
  }
  function call(fn, ...args) {
    if (API) return callApi(fn, args);
    if (demo) return Demo.call(fn, args);
    return new Promise((res, rej) => {
      const timer = setTimeout(() => rej(new Error("timeout")), 25000);
      google.script.run
        .withSuccessHandler((v) => { clearTimeout(timer); res(v); })
        .withFailureHandler((e) => { clearTimeout(timer); rej(e); })[fn](...args);
    });
  }

  /* ---------- Local list ---------- */
  function fromRow(r) {
    return P ? { dni: r[0], nombre: r[1], emp: r[2], est: r[3], h: r[4], hs: r[5], por: r[6], te: r[8] || 0, ts: r[9] || 0 }
             : { dni: r[0], nombre: r[1], a: r[2], o: r[3], est: !!r[4], h: r[5], por: r[6] };
  }
  function aplicarLista(d) {
    S.lista = new Map(d.items.map((r) => [r[0], fromRow(r)]));
    S.otros = new Set(d.otros || []);
    S.version = d.v; S.cargada = true; S.listaHora = nowHora();
    store.set("lista", { items: d.items, otros: d.otros, v: d.v, hora: S.listaHora });
    S.pend.forEach(aplicarLocal);
    render();
  }
  function aplicarLocal(it) {
    const g = S.lista.get(it.dni);
    if (!g) return;
    if (it.tipo === "in") Object.assign(g, { est: true, h: it.hora, por: S.guardia });
    else if (it.tipo === "entrada") Object.assign(g, { est: "Adentro", h: it.hora, te: it.t, por: S.guardia });
    else if (it.tipo === "salida") Object.assign(g, { est: "Afuera", hs: it.hora, ts: it.t, por: S.guardia });
    else if (it.tipo === "deshacer" && it.prev) Object.assign(g, it.prev);
  }

  async function refrescar(forzar) {
    if (!S.pin) return null;
    S.polls++;
    const seq = S.syncSeq;
    const v = forzar || S.polls % 10 === 0 ? "" : S.version;
    try {
      const d = await call("lista", MODO, S.pin, v);
      if (d.error === "pin") { pedirSetup("El PIN cambió o es incorrecto. Escribilo de nuevo."); return false; }
      marcarOnline(true);
      // A list read before our last sync finished could be missing those ingresos: ask again instead.
      if (!d.same) { if (seq === S.syncSeq || forzar) aplicarLista(d); else S.version = ""; }
      return true;
    } catch (e) {
      marcarOnline(false);
      return null;
    }
  }

  /* ---------- Sending queue ---------- */
  function nuevoItem(tipo, dni, extra) {
    return Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo, dni, t: Date.now(), hora: nowHora() }, extra);
  }
  function encolar(it) { S.pend.push(it); store.set("pend", S.pend); pintarRed(); sync(); }

  async function sync() {
    if (S.inflight || !S.pend.length || !S.pin) return;
    S.inflight = true;
    const lote = S.pend.slice(0, 25);
    S.enviando = new Set(lote.map((i) => i.id));
    pintarRed();
    let seguir = false;
    try {
      const res = await call("sincronizar", MODO, S.pin, S.guardia, lote.map(({ id, tipo, dni, t }) => ({ id, tipo, dni, t })));
      if (res && res.error === "pin") { pedirSetup("El PIN cambió o es incorrecto. Escribilo de nuevo."); return; }
      if (!res || !res.ok) throw new Error((res && res.error) || "error");
      S.syncSeq++;
      S.pend = S.pend.filter((i) => !S.enviando.has(i.id));
      store.set("pend", S.pend);
      marcarOnline(true);
      S.retry = 0;
      res.res.forEach((r) => resultado(r, lote.find((i) => i.id === r.id)));
      render();
      seguir = S.pend.length > 0;
    } catch (e) {
      marcarOnline(false);
      if (S.verdictId && S.enviando.has(S.verdictId)) setSync("Guardado en el celular · se envía cuando vuelva la señal");
      S.retry = Math.min(S.retry + 1, 5);
      clearTimeout(S.retryTimer);
      S.retryTimer = setTimeout(sync, [1, 2, 4, 8, 15][S.retry - 1] * 1000);
    } finally {
      S.inflight = false;
      S.enviando = new Set();
      pintarRed();
    }
    if (seguir) sync();
  }

  function resultado(r, it) {
    if (!it) return;
    const g = S.lista.get(it.dni);
    const nombre = (g && g.nombre) || "";
    const quien = `${nombre ? nombre + " · " : ""}DNI ${fmtDni(it.dni)}`;
    if (r.r === "ok") {
      if (g && r.hora && it.tipo !== "deshacer") { if (it.tipo === "salida") g.hs = r.hora; else g.h = r.hora; }
      marcarHist(it.id, "ok");
      if (S.verdictId === it.id) setSync("✓ Confirmado en la planilla");
      return;
    }
    marcarHist(it.id, "conf");
    if (r.r === "ya") {
      if (g) Object.assign(g, { est: true, h: r.hora, por: r.por });
      alerta(`${quien} ya había ingresado a las ${r.hora}${r.por ? ` (registró ${r.por})` : ""}. Este ingreso no se registró: revisá a la persona.`);
      if (S.verdictId === it.id) showVerdict("warn", MSG_YA, nombre, `DNI ${fmtDni(it.dni)} · ingresó a las ${r.hora}${r.por ? ` · registró ${r.por}` : ""}`);
    } else if (r.r === "conflicto") {
      if (g) Object.assign(g, r.estado === "Adentro" ? { est: "Adentro", h: r.hora, por: r.por } : { est: "Afuera", hs: r.hora, por: r.por });
      const desde = r.hora ? ` desde las ${r.hora}` : "";
      alerta(`${quien} ya figuraba ${r.estado.toUpperCase()}${desde}${r.por ? ` (registró ${r.por})` : ""}. Este movimiento no se registró.`);
      if (S.verdictId === it.id) { hideUndo(); showVerdict("warn", `Ya figuraba ${r.estado.toUpperCase()}`, nombre, `DNI ${fmtDni(it.dni)}${desde}${r.por ? ` · registró ${r.por}` : ""} · no se registró`); }
    } else if (r.r === "tarde") {
      alerta(`No se pudo anular ${quien}: pasaron más de ${5} minutos. Corregilo en la planilla.`);
      refrescar(true);
    } else if (r.r === "no" || r.r === "otro") {
      alerta(`${quien} ya no figura en la lista${r.r === "otro" ? " (es del otro sistema)" : ""}. No se registró.`);
      refrescar(true);
    } else {
      alerta(`No se pudo registrar ${quien}. Volvé a cargarlo.`);
    }
  }

  /* ---------- Controls ---------- */
  async function controlar(raw, forzar) {
    hideConfirm();
    const dni = onlyDigits(raw);
    if (dni.length < 6 || dni.length > 9) { showVerdict("bad", "DNI incompleto", "", "Revisá el número: debe tener entre 7 y 8 dígitos"); feedback("bad"); return; }
    $("dni").value = "";
    let g = S.lista.get(dni);
    if (!g && !S.otros.has(dni) && S.online) {
      // Maybe the organizer just added this person: check against the latest list.
      showVerdict("idle busy", "Buscando en la lista…", "", `DNI ${fmtDni(dni)}`);
      await refrescar(true);
      g = S.lista.get(dni);
    }
    if (!g) {
      const otro = S.otros.has(dni);
      if (otro) showVerdict("bad", T.otro, "", `DNI ${fmtDni(dni)} · ${T.otroMeta}`);
      else showVerdict("bad", T.no, "", `DNI ${fmtDni(dni)}` + (S.online ? "" : ` · sin conexión: lista de las ${S.listaHora || "–"}`));
      feedback("bad");
      addHist({ dni, r: otro ? "otro" : "no" });
      return;
    }
    if (!P) {
      if (g.est) {
        showVerdict("warn", MSG_YA, g.nombre, `DNI ${fmtDni(dni)}` + (g.h ? ` · ingresó a las ${g.h}` : "") + (g.por ? ` · registró ${g.por}` : ""));
        feedback("bad");
        addHist({ dni, r: "ya", nombre: g.nombre });
        return;
      }
      const it = nuevoItem("in", dni, { prev: { est: false, h: "", por: "" } });
      aplicarLocal(it);
      showVerdict("ok", "VÁLIDO", g.nombre, `DNI ${fmtDni(dni)} · ${it.hora}`, { acomp: g.a, nota: g.o, id: it.id });
      feedback("ok");
      addHist({ id: it.id, dni, r: "ok", nombre: g.nombre });
      ofrecerDeshacer(it, `¿Error con ${fmtDni(dni)}? Anulá este ingreso.`);
      encolar(it);
    } else {
      const adentro = g.est === "Adentro";
      const ultimo = adentro ? g.te : g.ts;
      if (!forzar && ultimo && Date.now() - ultimo < RECIENTE_MS) {
        pedirConfirmacion(g, adentro, ultimo);
        return;
      }
      const desde = g.h;
      const it = nuevoItem(adentro ? "salida" : "entrada", dni, { prev: { est: g.est, h: g.h, hs: g.hs, te: g.te, ts: g.ts, por: g.por } });
      aplicarLocal(it);
      const quien = g.nombre + (g.emp ? " · " + g.emp : "");
      if (adentro) showVerdict("out", "SALIDA", quien, `DNI ${fmtDni(dni)} · ${it.hora}` + (desde ? ` · había entrado ${desde}` : ""), { id: it.id });
      else showVerdict("ok", "ENTRADA", quien, `DNI ${fmtDni(dni)} · ${it.hora}`, { id: it.id });
      feedback(adentro ? "out" : "ok");
      addHist({ id: it.id, dni, r: adentro ? "salida" : "entrada", nombre: quien });
      ofrecerDeshacer(it, `¿Error con ${fmtDni(dni)}? Anulá esta ${adentro ? "salida" : "entrada"}.`);
      encolar(it);
    }
    render();
  }

  const RECIENTE_MS = 3 * 60000;
  function hace(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60 ? (s % 60) + " s" : ""}`.trim();
  }
  function pedirConfirmacion(g, adentro, ultimo) {
    const mov = adentro ? "ENTRADA" : "SALIDA";
    const nuevo = adentro ? "salida" : "entrada";
    showVerdict("warn", `¿Registrar ${nuevo.toUpperCase()}?`, g.nombre + (g.emp ? " · " + g.emp : ""),
      `DNI ${fmtDni(g.dni)} · ya registró ${mov} hace ${hace(ultimo)}${g.por ? ` (${g.por})` : ""}`);
    $("confirmar-texto").textContent = `Hace ${hace(ultimo)} se le registró ${mov}. Si otro guardia ya lo registró, tocá Cancelar.`;
    $("btn-confirmar").textContent = `Sí, registrar ${nuevo}`;
    $("btn-confirmar").onclick = () => { controlar(g.dni, true); $("dni").focus(); };
    $("confirmar-fila").hidden = false;
    feedback("bad");
    addHist({ dni: g.dni, r: "duda", nombre: g.nombre });
  }
  function hideConfirm() { $("confirmar-fila").hidden = true; }

  function ofrecerDeshacer(it, texto) {
    clearTimeout(S.undoTimer);
    S.undo = it;
    $("deshacer-texto").textContent = texto;
    $("btn-deshacer").disabled = false;
    $("deshacer-fila").hidden = false;
    S.undoTimer = setTimeout(hideUndo, 90000);
  }
  function hideUndo() { clearTimeout(S.undoTimer); S.undo = null; $("deshacer-fila").hidden = true; }

  function deshacer() {
    const u = S.undo;
    if (!u) return;
    hideUndo();
    const g = S.lista.get(u.dni);
    const i = S.pend.findIndex((p) => p.id === u.id);
    if (i !== -1 && !S.enviando.has(u.id)) {
      // Not sent yet: just drop it.
      S.pend.splice(i, 1);
      store.set("pend", S.pend);
      if (g) Object.assign(g, u.prev);
    } else {
      const it = nuevoItem("deshacer", u.dni, { prev: u.prev });
      aplicarLocal(it);
      encolar(it);
    }
    marcarHist(u.id, "anulado");
    showVerdict("idle", "Movimiento anulado", "", `DNI ${fmtDni(u.dni)} · quedó como estaba antes`);
    S.verdictId = null;
    feedback("out");
    render();
  }

  /* ---------- Rendering ---------- */
  function setNotice(html, alert) {
    const el = $("estado");
    if (!html) { el.hidden = true; return; }
    el.hidden = false; el.className = "notice" + (alert ? " alert" : ""); el.innerHTML = html;
  }

  function marcarOnline(on) { S.online = on; pintarRed(); }
  function pintarRed() {
    const c = $("chip-red");
    const n = S.pend.length;
    c.classList.toggle("off", !S.online);
    c.classList.toggle("sending", S.online && S.inflight);
    if (!S.online) c.textContent = n ? `Sin señal · ${n} sin enviar` : "Sin señal";
    else if (n) c.textContent = `Enviando ${n}…`;
    else c.textContent = "En línea";
  }

  function render() {
    const all = [...S.lista.values()];
    let a, b;
    if (P) { a = all.filter((g) => g.est === "Adentro").length; b = all.length - a; }
    else { a = all.filter((g) => g.est).length; b = all.length - a; }
    $("s1").textContent = S.cargada ? a.toLocaleString("es-AR") : "–";
    $("s2").textContent = S.cargada ? b.toLocaleString("es-AR") : "–";
    $("s3").textContent = S.cargada ? all.length.toLocaleString("es-AR") : "–";
    $("s-bar").style.width = all.length ? (a / all.length * 100).toFixed(1) + "%" : "0";
    if (!P) {
      const acomp = all.reduce((s, g) => s + (Number(g.a) || 0), 0);
      const personas = all.filter((g) => g.est).reduce((s, g) => s + 1 + (Number(g.a) || 0), 0);
      $("s-extra").hidden = !acomp;
      $("s-extra").textContent = `Contando acompañantes: ${personas.toLocaleString("es-AR")} personas adentro de ${(all.length + acomp).toLocaleString("es-AR")}`;
    }
    if (S.cargada && !all.length) setNotice(`<span><strong>Lista vacía.</strong> ${T.vacia}</span>`, true);
    else if (!demo) setNotice("");
    $("tools-info").textContent = S.cargada ? `Lista actualizada a las ${S.listaHora} · ${all.length.toLocaleString("es-AR")} personas` : "";
    pintarRed();
  }

  function span(cls, text) { const el = document.createElement("span"); el.className = cls; el.textContent = text; return el; }

  function showVerdict(kind, big, who, meta, extra) {
    extra = extra || {};
    const v = $("verdict");
    v.className = "verdict " + kind;
    v.replaceChildren();
    const b = document.createElement("div"); b.className = "big"; b.textContent = big; v.append(b);
    if (who) v.append(Object.assign(document.createElement("div"), { className: "who", textContent: who }));
    const ac = Number(extra.acomp) || 0;
    if (ac) v.append(Object.assign(document.createElement("div"), { className: "extra", textContent: `+ ${ac} acompañante${ac > 1 ? "s" : ""}` }));
    if (extra.nota) v.append(Object.assign(document.createElement("div"), { className: "nota", textContent: extra.nota }));
    if (meta) v.append(Object.assign(document.createElement("div"), { className: "meta", textContent: meta }));
    S.verdictId = extra.id || null;
    if (extra.id) {
      v.append(Object.assign(document.createElement("div"), { className: "sync", id: "v-sync" }));
      setSync(S.online ? "Enviando a la planilla…" : "Guardado en el celular · se envía cuando vuelva la señal");
    }
  }
  function setSync(t) { const el = $("v-sync"); if (el) el.textContent = t; }

  function alerta(texto) {
    const box = document.createElement("div");
    box.className = "alerta";
    box.setAttribute("role", "alert");
    box.append(Object.assign(document.createElement("strong"), { textContent: "ATENCIÓN" }), Object.assign(document.createElement("span"), { textContent: texto }));
    const ok = Object.assign(document.createElement("button"), { type: "button", textContent: "Entendido" });
    ok.addEventListener("click", () => box.remove());
    box.append(ok);
    $("alertas").prepend(box);
    feedback("alarma");
  }

  const PILLS = {
    ok: ["pill ok", "Válido"], ya: ["pill warn", "Ya ingresó"], entrada: ["pill ok", "Entrada"], salida: ["pill out", "Salida"],
    otro: ["pill bad", P ? "Es invitado" : "Es personal"], no: ["pill bad", "No está"], duda: ["pill warn", "Consultó"],
  };
  const ESTADOS = { pend: "enviando…", ok: "✓ en planilla", conf: "⚠ revisar", anulado: "anulado" };
  function addHist(h) {
    h.at = nowHora();
    if (h.id) h.st = "pend";
    S.hist.unshift(h);
    S.hist = S.hist.slice(0, 20);
    store.set("hist", S.hist);
    renderHist();
  }
  function marcarHist(id, st) {
    const h = S.hist.find((x) => x.id === id);
    if (h) { h.st = st; store.set("hist", S.hist); renderHist(); }
  }
  function renderHist() {
    const ul = $("historial");
    ul.replaceChildren();
    if (!S.hist.length) { const e = document.createElement("li"); e.className = "empty"; e.textContent = "Todavía no se controló ningún DNI en este celular."; ul.append(e); return; }
    for (const h of S.hist) {
      const [cls, txt] = PILLS[h.r] || PILLS.no;
      const row = document.createElement("li");
      const mid = document.createElement("div"); mid.style.minWidth = "0";
      mid.append(span("d", fmtDni(h.dni)));
      if (h.nombre) mid.append(document.createElement("br"), span("nm", h.nombre));
      const acc = document.createElement("div"); acc.className = "acc";
      acc.append(span("t", h.at));
      if (h.st) acc.append(span("st" + (h.st === "conf" ? " conf" : ""), ESTADOS[h.st] || ""));
      row.append(span(cls, txt), mid, acc);
      ul.append(row);
    }
  }

  function renderBusqueda() {
    const ul = $("resultados");
    const q = norm($("buscar").value.trim());
    ul.replaceChildren();
    ul.hidden = q.length < 2;
    if (q.length < 2) return;
    const partes = q.split(/\s+/);
    const res = [...S.lista.values()].filter((g) => { const n = norm(g.nombre + " " + (g.emp || "")); return partes.every((p) => n.includes(p)); }).slice(0, 8);
    if (!res.length) { const e = document.createElement("li"); e.className = "empty"; e.textContent = "Nadie coincide con esa búsqueda."; ul.append(e); return; }
    for (const g of res) {
      const row = document.createElement("li");
      const mid = document.createElement("div"); mid.style.minWidth = "0";
      mid.append(span("nm", g.nombre || "(sin nombre)"), document.createElement("br"), span("d", fmtDni(g.dni) + (g.emp ? " · " + g.emp : "")));
      const acc = document.createElement("div"); acc.className = "acc";
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn small";
      if (P) b.textContent = g.est === "Adentro" ? "Registrar salida" : "Registrar entrada";
      else if (g.est) { b.textContent = "Ya ingresó"; b.disabled = true; }
      else b.textContent = "Registrar ingreso";
      b.addEventListener("click", () => {
        $("buscar").value = ""; renderBusqueda(); $("buscar-box").open = false;
        controlar(g.dni);
        $("verdict").scrollIntoView({ block: "center", behavior: "smooth" });
      });
      acc.append(b);
      row.append(mid, acc);
      ul.append(row);
    }
  }

  /* ---------- Sound and vibration ---------- */
  let actx = null;
  const SONIDOS = { ok: [[880, 0.09], [1320, 0.14]], out: [[1320, 0.09], [880, 0.14]], bad: [[220, 0.4]], alarma: [[660, 0.18], [440, 0.18], [660, 0.18], [440, 0.3]] };
  const VIBRA = { ok: [60], out: [60, 60, 60], bad: [300, 80, 300], alarma: [400, 120, 400, 120, 400] };
  function feedback(k) {
    if (S.sonido) {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === "suspended") actx.resume();
        let t = actx.currentTime + 0.01;
        for (const [f, d] of SONIDOS[k]) {
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = "sine"; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.connect(g).connect(actx.destination);
          o.start(t); o.stop(t + d + 0.02);
          t += d + 0.05;
        }
      } catch (e) {}
    }
    try { if (navigator.vibrate) navigator.vibrate(VIBRA[k]); } catch (e) {}
  }

  async function probarVelocidad() {
    const N = 8;
    $("btn-velocidad").disabled = true;
    $("tools-info").textContent = `Probando ${N} registros al mismo tiempo…`;
    const tiempos = await Promise.all(Array.from({ length: N }, async () => {
      const t0 = performance.now();
      try { const r = await call("prueba", MODO, S.pin); return r && r.ok ? (performance.now() - t0) / 1000 : null; }
      catch (e) { return null; }
    }));
    const ok = tiempos.filter((x) => x != null);
    const f = (x) => x.toLocaleString("es-AR", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
    $("tools-info").textContent = ok.length
      ? `${N} registros simultáneos: promedio ${f(ok.reduce((a, b) => a + b, 0) / ok.length)} s · el más lento ${f(Math.max(...ok))} s` + (ok.length < N ? ` · ${N - ok.length} fallaron` : "") + ". El guardia no espera esto: el resultado sale al instante y se confirma después."
      : "No se pudo probar: revisá la conexión.";
    $("btn-velocidad").disabled = false;
  }

  /* ---------- Setup ---------- */
  function pedirSetup(error) {
    $("control").hidden = true;
    $("form-setup").hidden = false;
    $("pin").value = error ? "" : S.pin;
    $("guardia").value = S.guardia || $("guardia").value;
    $("setup-error").hidden = !error;
    $("setup-error").textContent = error || "";
    (S.pin && !error ? $("guardia") : $("pin")).focus();
  }
  function mostrarControl() {
    $("form-setup").hidden = true;
    $("control").hidden = false;
    $("chip-guardia").hidden = !S.guardia;
    $("chip-guardia").textContent = S.guardia ? `Registra: ${S.guardia}` : "";
    $("dni").focus();
  }

  $("form-setup").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pin = $("pin").value.trim(), guardia = $("guardia").value.trim().replace(/\s+/g, " ");
    if (!guardia) { $("setup-error").hidden = false; $("setup-error").textContent = "Escribí tu nombre o puesto."; return; }
    const antes = S.pin;
    S.pin = pin;
    const ok = await refrescar(true);
    if (ok === false) { S.pin = antes; $("setup-error").hidden = false; $("setup-error").textContent = "PIN incorrecto. Probá de nuevo."; return; }
    if (ok === null && !S.cargada) { S.pin = antes; $("setup-error").hidden = false; $("setup-error").textContent = "Sin conexión. Conectate a internet y probá de nuevo."; return; }
    S.guardia = guardia;
    store.set("pin", pin); store.set("guardia", guardia);
    mostrarControl();
    sync();
  });

  /* ---------- Wiring ---------- */
  $("band-titulo").textContent = T.banda;
  $("band-sub").textContent = T.sub;
  $("dni-label").textContent = T.dni;
  $("btn-check").textContent = T.boton;
  T.s.forEach((t, i) => { $(`s${i + 1}-l`).textContent = t; });
  $("btn-sonido").textContent = S.sonido ? "Sonido: sí" : "Sonido: no";

  $("dni").addEventListener("input", (e) => {
    const d = onlyDigits(e.target.value).slice(0, 9);
    e.target.value = fmtDni(d);
    const v = $("verdict");
    if (d && !v.classList.contains("idle")) v.classList.add("stale");
  });
  $("form-check").addEventListener("submit", (e) => { e.preventDefault(); controlar($("dni").value); $("dni").focus(); });
  $("btn-deshacer").addEventListener("click", deshacer);
  $("btn-cancelar").addEventListener("click", () => { hideConfirm(); showVerdict("idle", "No se registró nada", "", "Cancelado"); $("dni").focus(); });
  $("buscar").addEventListener("input", renderBusqueda);
  $("chip-guardia").addEventListener("click", () => pedirSetup(""));
  $("btn-actualizar").addEventListener("click", async () => { $("tools-info").textContent = "Actualizando…"; const ok = await refrescar(true); if (ok === null) $("tools-info").textContent = "Sin conexión: se usa la lista guardada en el celular."; sync(); });
  $("btn-sonido").addEventListener("click", () => { S.sonido = !S.sonido; store.set("sonido", S.sonido); $("btn-sonido").textContent = S.sonido ? "Sonido: sí" : "Sonido: no"; if (S.sonido) feedback("ok"); });
  $("btn-velocidad").addEventListener("click", probarVelocidad);
  window.addEventListener("online", () => { S.retry = 0; sync(); refrescar(false); });

  let wake = null;
  async function keepAwake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) {} }
  document.addEventListener("pointerdown", keepAwake, { once: true });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); refrescar(false); sync(); } });
  window.addEventListener("beforeunload", (e) => { if (S.pend.length) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- Demo backend (only outside Google, for previews) ---------- */
  const Demo = {
    data: P
      ? { "44444444": ["Personal de prueba 1", "Catering"], "55555555": ["Personal de prueba 2", "Sonido"], "66666666": ["Personal de prueba 3", "Limpieza"] }
      : { "11111111": ["Invitado de prueba 1", 0, ""], "22222222": ["Invitado de prueba 2", 2, "VIP · Mesa 3"], "33333333": ["Invitado de prueba 3", 1, ""] },
    otros: P ? ["11111111", "22222222", "33333333"] : ["44444444", "55555555", "66666666"],
    st: {}, v: 1,
    call(fn, args) {
      return new Promise((res, rej) => setTimeout(() => {
        if (window.__offline) return rej(new Error("offline"));
        try { res(this[fn](...args)); } catch (e) { rej(e); }
      }, window.__latencia == null ? 400 : window.__latencia));
    },
    lista(app, pin, v) {
      if (pin !== "0000") return { error: "pin" };
      if (v && v === String(this.v)) return { same: true, v: String(this.v) };
      const items = Object.entries(this.data).map(([dni, d], i) => {
        const s = this.st[dni] || {};
        return P ? [dni, d[0], d[1], s.est || "", s.h || "", s.hs || "", s.por || "", i + 2, s.te || 0, s.ts || 0] : [dni, d[0], d[1], d[2], !!s.est, s.h || "", s.por || "", i + 2];
      });
      return { v: String(this.v), items, otros: this.otros };
    },
    sincronizar(app, pin, guardia, items) {
      if (pin !== "0000") return { error: "pin" };
      const res = items.map((it) => {
        const s = this.st[it.dni] = this.st[it.dni] || {};
        const h = new Date(it.t).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
        if (!this.data[it.dni] && it.tipo !== "deshacer") return { id: it.id, r: this.otros.includes(it.dni) ? "otro" : "no" };
        if (it.tipo === "deshacer") { if (s.prev) Object.assign(s, s.prev); else Object.assign(s, { est: "", h: "", hs: "", por: "" }); this.v++; return { id: it.id, r: "ok" }; }
        if (it.tipo === "in") { if (s.est) return { id: it.id, r: s.por === guardia ? "ok" : "ya", hora: s.h, por: s.por }; s.prev = { ...s }; Object.assign(s, { est: true, h, por: guardia }); }
        if (it.tipo === "entrada") { if (s.est === "Adentro") return { id: it.id, r: "conflicto", estado: "Adentro", hora: s.h, por: s.por }; s.prev = { ...s }; Object.assign(s, { est: "Adentro", h, por: guardia }); }
        if (it.tipo === "salida") { if (s.est !== "Adentro") return { id: it.id, r: "conflicto", estado: "Afuera", hora: s.hs, por: s.por }; s.prev = { ...s }; Object.assign(s, { est: "Afuera", hs: h, por: guardia }); }
        this.v++;
        return { id: it.id, r: "ok", hora: h };
      });
      return { ok: true, res };
    },
    prueba() { return { ok: true }; },
  };
  window.__demo = Demo;

  /* ---------- Start ---------- */
  const guardada = store.get("lista", null);
  if (guardada && guardada.items) { aplicarLista(guardada); S.listaHora = guardada.hora || ""; S.version = ""; }
  renderHist();
  render();
  if (demo) setNotice("<span><strong>Vista de demostración.</strong> PIN 0000 · " + (P ? "DNI de prueba 44444444, 55555555 y 66666666." : "DNI de prueba 11111111, 22222222 y 33333333.") + "</span>");
  if (!S.pin || !S.guardia) pedirSetup("");
  else { mostrarControl(); refrescar(true).then(() => sync()); }
  setInterval(() => { if (!S.inflight && S.pin && !$("control").hidden && document.visibilityState === "visible") refrescar(false); }, 8000);
})();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
</body>
